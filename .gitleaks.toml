[extend]
useDefault = true

[[allowlists]]
description = "Preference migration marker and pinned Unicode source checksum are not credentials"
regexTarget = "secret"
regexes = [
  '^plezy_legacy_prefs_migrated_v1$',
  '^a3255d45b7af97f4dc14fb8364d7573b434425e5c58cacf00d16901ce081c78d$',
]

[[allowlists]]
description = "Key generator's PEM template contains an interpolated generated value, not a stored private key"
condition = "AND"
regexTarget = "match"
paths = ['packages/vendor/auto_updater/packages/auto_updater/bin/generate_keys\.dart$']
regexes = ['base64\.encode\(seed\)']
